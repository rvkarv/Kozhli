name: Apply Kozhli UI rules

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Kozhli UI relationship colors and language picker') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard, Thaarai colors and language picker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('panchapakshi_app/lib/screens/home_screen.dart')
          s = home.read_text()

          s = s.replace(
              "  static const _green = Color(0xFF9BE34A);\n",
              "  static const _green = Color(0xFF9BE34A);\n  static const _danger = Color(0xFFC00000);\n",
          )

          s = s.replace(
              """                    Text(\n                      state.jamamActivity.tamil,\n                      style: const TextStyle(\n                        color: _HomeScreenState._green,\n                        fontSize: 23,\n                        fontWeight: FontWeight.bold,\n                      ),\n                    ),""",
              """                    Text(\n                      state.jamamActivity.tamil,\n                      style: TextStyle(\n                        color: _activityColor(state.jamamActivity),\n                        fontSize: 23,\n                        fontWeight: FontWeight.bold,\n                      ),\n                    ),""",
          )

          s = s.replace(
              """            style: TextStyle(\n              color: accent,\n              fontSize: 16,\n              fontWeight: FontWeight.bold,\n            ),""",
              """            style: TextStyle(\n              color: _activityColor(activity),\n              fontSize: 16,\n              fontWeight: FontWeight.bold,\n            ),""",
              1,
          )

          s = s.replace(
              """          _RelationChip(\n            label: _kozhliRelationship(bird),\n            color: accent,\n          ),""",
              """          _RelationChip(\n            label: _kozhliRelationship(bird),\n            color: _relationshipColor(bird),\n          ),""",
          )

          old_authority = """  @override\n  Widget build(BuildContext context) {\n    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 8),"""
          new_authority = """  @override\n  Widget build(BuildContext context) {\n    final isPadu = title == 'படுபட்சி';\n    final roleColor = isPadu ? _HomeScreenState._danger : _HomeScreenState._muted;\n    return Padding(\n      padding: const EdgeInsets.symmetric(horizontal: 8),"""
          if old_authority in s:
              s = s.replace(old_authority, new_authority, 1)

          s = s.replace(
              """                  style: const TextStyle(\n                    color: _HomeScreenState._muted,\n                    fontSize: 10,\n                  ),""",
              """                  style: TextStyle(\n                    color: roleColor,\n                    fontSize: 10,\n                    fontWeight: isPadu ? FontWeight.bold : FontWeight.normal,\n                  ),""",
              1,
          )
          s = s.replace(
              """                  style: const TextStyle(\n                    color: Colors.white,\n                    fontSize: 14,\n                    fontWeight: FontWeight.bold,\n                  ),""",
              """                  style: TextStyle(\n                    color: isPadu ? _HomeScreenState._danger : Colors.white,\n                    fontSize: 14,\n                    fontWeight: FontWeight.bold,\n                  ),""",
              1,
          )

          s = s.replace(
              """        Text(\n          '${t.birthNakshatra} → ${t.todayNakshatra}',\n          style: const TextStyle(\n            color: Colors.white,\n            fontSize: 14,\n            fontWeight: FontWeight.w600,\n          ),\n        ),""",
              """        Text(\n          '${t.birthNakshatra} → ${t.todayNakshatra}',\n          style: TextStyle(\n            color: _thaaraiColor(t.ordinalFromBirth),\n            fontSize: 14,\n            fontWeight: FontWeight.w600,\n          ),\n        ),""",
          )
          s = s.replace(
              """        Text(\n          '${t.ordinalFromBirth} — ${t.category.tamil}',\n          style: TextStyle(\n            color: accent,\n            fontSize: 17,\n            fontWeight: FontWeight.bold,\n          ),\n        ),""",
              """        Text(\n          '${t.ordinalFromBirth} — ${t.category.tamil}',\n          style: TextStyle(\n            color: _thaaraiColor(t.ordinalFromBirth),\n            fontSize: 17,\n            fontWeight: FontWeight.bold,\n          ),\n        ),""",
          )
          s = s.replace(
              """        Text(\n          t.category.effect,\n          style: const TextStyle(color: Colors.white70, fontSize: 11),\n        ),""",
              """        Text(\n          t.category.effect,\n          style: TextStyle(\n            color: _thaaraiColor(t.ordinalFromBirth),\n            fontSize: 11,\n          ),\n        ),""",
          )

          old_rel = """// Relationship is evaluated from the app's fixed Kozhli (கோழி) reference\n// bird: மயில் is நட்பு, கோழி is சுயம், காகம் is நட்பு, and\n// வல்லூறு / ஆந்தை are பகை பட்சி.\nString _kozhliRelationship(Pakshi bird) {\n  switch (bird) {\n    case Pakshi.kozhi:\n      return 'சுயம்';\n    case Pakshi.mayil:\n      return 'நட்பு';\n    case Pakshi.kaagam:\n      return 'நட்பு';\n    case Pakshi.vallooru:\n    case Pakshi.aandhai:\n      return 'பகை பட்சி';\n  }\n}\n"""
          new_rel = """// Fixed Kozhli relationship mapping: கோழி = சுயம்,\n// மயில்/காகம் = நட்பு, வல்லூறு/ஆந்தை = பகை.\nString _kozhliRelationship(Pakshi bird) {\n  switch (bird) {\n    case Pakshi.kozhi:\n      return 'சுயம்';\n    case Pakshi.mayil:\n    case Pakshi.kaagam:\n      return 'நட்பு';\n    case Pakshi.vallooru:\n    case Pakshi.aandhai:\n      return 'பகை';\n  }\n}\n\nColor _relationshipColor(Pakshi bird) {\n  switch (bird) {\n    case Pakshi.vallooru:\n    case Pakshi.aandhai:\n      return _HomeScreenState._danger;\n    case Pakshi.kozhi:\n    case Pakshi.mayil:\n    case Pakshi.kaagam:\n      return _HomeScreenState._green;\n  }\n}\n\nColor _activityColor(Thozhil activity) {\n  switch (activity) {\n    case Thozhil.thuyil:\n    case Thozhil.saavu:\n      return _HomeScreenState._danger;\n    case Thozhil.oon:\n    case Thozhil.nadai:\n    case Thozhil.arasu:\n      return _HomeScreenState._green;\n  }\n}\n\nColor _thaaraiColor(int ordinal) {\n  const red = {1, 3, 5, 7, 9, 10, 12, 14, 16, 18, 19, 21, 23, 25};\n  return red.contains(ordinal)\n      ? _HomeScreenState._danger\n      : _HomeScreenState._green;\n}\n"""
          if old_rel not in s:
              raise SystemExit('home relationship block not found')
          s = s.replace(old_rel, new_rel)
          home.write_text(s)

          forecast = Path('panchapakshi_app/lib/screens/forecast_screen.dart')
          f = forecast.read_text()
          start = f.index("            ListTile(\n              leading: const Text('தமிழ்'")
          end = f.index("          ],\n        ),", start)
          tiles = """            ListTile(\n              leading: const Text('தமிழ்', style: TextStyle(fontSize: 18)),\n              title: const Text('தமிழ்'),\n              onTap: () => Navigator.pop(context, const Locale('ta')),\n            ),\n            ListTile(\n              leading: const Text('हिन्दी', style: TextStyle(fontSize: 18)),\n              title: const Text('हिन्दी'),\n              onTap: () => Navigator.pop(context, const Locale('hi')),\n            ),\n            ListTile(\n              leading: const Text('తెలుగు', style: TextStyle(fontSize: 18)),\n              title: const Text('తెలుగు'),\n              onTap: () => Navigator.pop(context, const Locale('te')),\n            ),\n            ListTile(\n              leading: const Text('ಕನ್ನಡ', style: TextStyle(fontSize: 18)),\n              title: const Text('ಕನ್ನಡ'),\n              onTap: () => Navigator.pop(context, const Locale('kn')),\n            ),\n            ListTile(\n              leading: const Text('മലയാളം', style: TextStyle(fontSize: 18)),\n              title: const Text('മലയാളം'),\n              onTap: () => Navigator.pop(context, const Locale('ml')),\n            ),\n            ListTile(\n              leading: const Text('मराठी', style: TextStyle(fontSize: 18)),\n              title: const Text('मराठी'),\n              onTap: () => Navigator.pop(context, const Locale('mr')),\n            ),\n            ListTile(\n              leading: const Text('বাংলা', style: TextStyle(fontSize: 18)),\n              title: const Text('বাংলা'),\n              onTap: () => Navigator.pop(context, const Locale('bn')),\n            ),\n            ListTile(\n              leading: const Text('ગુજરાતી', style: TextStyle(fontSize: 18)),\n              title: const Text('ગુજરાતી'),\n              onTap: () => Navigator.pop(context, const Locale('gu')),\n            ),\n            ListTile(\n              leading: const Text('ਪੰਜਾਬੀ', style: TextStyle(fontSize: 18)),\n              title: const Text('ਪੰਜਾਬੀ'),\n              onTap: () => Navigator.pop(context, const Locale('pa')),\n            ),\n            ListTile(\n              leading: const Text('অসমীয়া', style: TextStyle(fontSize: 18)),\n              title: const Text('অসমীয়া'),\n              onTap: () => Navigator.pop(context, const Locale('as')),\n            ),\n            ListTile(\n              leading: const Text('ଓଡ଼ିଆ', style: TextStyle(fontSize: 18)),\n              title: const Text('ଓଡ଼ିଆ'),\n              onTap: () => Navigator.pop(context, const Locale('or')),\n            ),\n            ListTile(\n              leading: const Text('اردو', style: TextStyle(fontSize: 18)),\n              title: const Text('اردو'),\n              onTap: () => Navigator.pop(context, const Locale('ur')),\n            ),\n            ListTile(\n              leading: const Text('EN', style: TextStyle(fontSize: 18)),\n              title: const Text('English'),\n              onTap: () => Navigator.pop(context, const Locale('en')),\n            ),\n"""
          f = f[:start] + tiles + f[end:]
          forecast.write_text(f)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panchapakshi_app/lib/screens/home_screen.dart panchapakshi_app/lib/screens/forecast_screen.dart
          git rm .github/workflows/apply-kozhli-ui-rules.yml
          git commit -m 'Apply Kozhli UI relationship colors and language picker'
          git push
