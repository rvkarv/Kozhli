name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panchapakshi_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.panchapakshi.kozhi --project-name panchapakshi_kozhi

      - name: Force compileSdk/targetSdk to 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk(Version)?[[:space:]]+[0-9]+/compileSdk 36/" "$f"
              sed -i -E "s/compileSdk[[:space:]]=[[:space:]][0-9]+/compileSdk = 36/" "$f"
              sed -i -E "s/targetSdk(Version)?[[:space:]]+[0-9]+/targetSdk 36/" "$f"
              sed -i -E "s/targetSdk[[:space:]]=[[:space:]][0-9]+/targetSdk = 36/" "$f"
            fi
          done

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.INTERNET\"/>#" $MANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: panchapakshi_app/build/app/outputs/flutter-apk/app-release.apk
