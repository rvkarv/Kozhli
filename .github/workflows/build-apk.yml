name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panchapakshi_app
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify triggering commit
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified checkout: $GITHUB_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Generate Android project
        run: flutter create . --platforms=android --org com.panchapakshi.kozhi --project-name panchapakshi_kozhi

      - name: Install dependencies
        run: flutter pub get

      - name: Run authoritative Master Workbook regression
        run: flutter test --no-pub test/master_workbook_alignment_final_regression_test.dart --reporter expanded

      - name: Run V2 Master Workbook regression
        run: flutter test --no-pub test/master_workbook_moon_regression_v2_test.dart --reporter expanded

      - name: Run full regression suite
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: panchapakshi_app/build/app/outputs/flutter-apk/app-release.apk
