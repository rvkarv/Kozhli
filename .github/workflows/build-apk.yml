name: Build Android APK

on:
  push:
    branches: [ main, master, fix/pure-dart-astronomy-master-alignment ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panchapakshi_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout is the triggering commit
        run: |
          test "$(git -C .. rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified checkout: $GITHUB_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.panchapakshi.kozhi --project-name panchapakshi_kozhi

      - name: Verify authoritative Master Workbook regression source
        run: |
          test -f test/master_workbook_alignment_final_regression_test.dart
          echo "HEAD=$(git -C .. rev-parse HEAD)"
          echo "REGRESSION SHA256=$(sha256sum test/master_workbook_alignment_final_regression_test.dart)"
          ! grep -qE '22:10:56|22:25:40' test/master_workbook_alignment_final_regression_test.dart
          grep -q '21, 56, 12, 884000' test/master_workbook_alignment_final_regression_test.dart

      - name: Add KOZHLI launcher icon and app label
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_kozhli.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#171717" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/><path android:fillColor="#E8A83A" android:pathData="M54,9A45,45 0,1 0,54 99A45,45 0,1 0,54 9M54,14A40,40 0,1 1,54 94A40,40 0,1 1,54 14"/></vector>
          EOF
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:label="panchapakshi_kozhi"#android:label="KOZHLI PANCHAPAKSHI"#' "$MANIFEST"

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.INTERNET\"/>#" "$MANIFEST"

      - name: Clean generated Flutter state
        run: |
          flutter clean
          rm -rf build .dart_tool

      - name: Install dependencies
        run: flutter pub get

      - name: Run authoritative Master Workbook Moon regression
        run: flutter test --no-pub test/master_workbook_alignment_final_regression_test.dart --reporter expanded

      - name: Run regression tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: panchapakshi_app/build/app/outputs/flutter-apk/app-release.apk

# CI trigger hardening: this workflow must execute the pushed commit SHA.
