name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panchapakshi_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify checkout is the triggering commit
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified checkout: $GITHUB_SHA"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.panchapakshi.kozhi --project-name panchapakshi_kozhi

      - name: Restore Master Workbook regression source
        run: |
          test -f test/master_workbook_moon_regression_v2_test.dart
          test -f test/master_workbook_alignment_final_regression_test.dart
          echo "HEAD=$(git -C .. rev-parse HEAD)"
          echo "ALIGNMENT TEST SHA256=$(sha256sum test/master_workbook_alignment_final_regression_test.dart)"
          echo "V2 TEST SHA256=$(sha256sum test/master_workbook_moon_regression_v2_test.dart)"
          grep -nE 'DateTime\.utc\(2026, 8, 14|DateTime\.utc\(2026, 8, 15' test/master_workbook_moon_regression_v2_test.dart

      - name: Add KOZHLI launcher icon and app label
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_kozhli.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#171717" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
          </vector>
          EOF
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:label="panchapakshi_kozhi"#android:label="KOZHLI PANCHAPAKSHI"#' "$MANIFEST"

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.INTERNET\"/>#" "$MANIFEST"

      - name: Clean generated Flutter state
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          rm -rf build .dart_tool
          find . -type f \( -name '*.dill' -o -name '*.kernel' \) -delete

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Verify and run authoritative Rajahmundry Master Workbook regression
        shell: bash
        run: |
          set -euo pipefail
          file=test/master_workbook_alignment_final_regression_test.dart
          test -f "$file"
          echo '--- SOURCE IDENTITY ---'
          git -C .. rev-parse HEAD
          echo "GITHUB_SHA=$GITHUB_SHA"
          sha256sum "$file"
          echo '--- EXPECTED UTC FIXTURES ---'
          grep -nF '2026-08-15T21:56:12.884Z' "$file"
          grep -nF '2026-08-16T22:21:04.425Z' "$file"
          grep -nF '2026-08-16T03:58:26.726Z' "$file"
          grep -nF '2026-08-16T10:03:21.647Z' "$file"
          if grep -nE '22:10:56|22:25:40|884000|425000|726000|647000' "$file"; then
            echo '::error::Invalid/stale DateTime fixture detected'
            exit 1
          fi
          rm -rf build/test_cache .dart_tool/test
          flutter test --no-pub "$file" --reporter expanded

      - name: Verify V2 Master Workbook source and run it in isolation
        shell: bash
        run: |
          set -euo pipefail
          source=test/master_workbook_moon_regression_v2_test.dart
          isolated="test/ci_v2_${GITHUB_SHA}.dart"
          test -f "$source"
          # Re-read the tracked file from the triggering commit immediately before compilation.
          git checkout -- "$source"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$source" "$isolated"
          trap 'rm -f "$isolated"' EXIT
          echo '--- V2 SOURCE IDENTITY AFTER HARD RESET ---'
          git -C .. rev-parse HEAD
          sha256sum "$source" "$isolated"
          sed -n '1,120p' "$isolated"
          grep -nF 'DateTime.utc(2026, 8, 14, 22, 13, 18, 742000)' "$isolated"
          grep -nF 'DateTime.utc(2026, 8, 15, 21, 56, 3, 156000)' "$isolated"
          grep -nF 'DateTime.utc(2026, 8, 15, 4, 5, 12, 797000)' "$isolated"
          grep -nF 'DateTime.utc(2026, 8, 15, 9, 59, 37, 906000)' "$isolated"
          if grep -nE '22:25:40|22:21:04|04:18:29|10:14:43' "$isolated"; then
            echo '::error::Unexpected stale V2 fixture detected in checked-out source'
            exit 1
          fi
          rm -rf build/test_cache .dart_tool/test
          flutter test --no-pub "$isolated" --reporter expanded

      - name: Isolated KOZHLI calculation check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool
          cat > tool/ci_kozhli_debug.dart <<'EOF'
          import 'package:panchapakshi_app/core/kozhli_success_rules.dart';
          import 'package:panchapakshi_app/models/pakshi.dart';
          void main() {
            final sunrise = DateTime.parse('2026-08-14T05:46:05.443Z').toLocal();
            final sunset = DateTime.parse('2026-08-14T18:29:09.913Z').toLocal();
            final nightEnd = DateTime.parse('2026-08-15T05:46:18.548Z').toLocal();
            final day = KozhliSuccessRules.windowsForPeriod(periodStart: sunrise, periodEnd: sunset, paksham: Paksham.valarpirai, dayNight: DayNight.day, rulingWeekday: DateTime.friday, paduDay: false);
            final night = KozhliSuccessRules.windowsForPeriod(periodStart: sunset, periodEnd: nightEnd, paksham: Paksham.valarpirai, dayNight: DayNight.night, rulingWeekday: DateTime.friday, paduDay: false);
            for (final w in day) print('DAY ${w.activity.tamil} ${w.start.toIso8601String()} -> ${w.end.toIso8601String()}');
            for (final w in night) print('NIGHT ${w.activity.tamil} ${w.start.toIso8601String()} -> ${w.end.toIso8601String()}');
          }
          EOF
          dart run tool/ci_kozhli_debug.dart
          rm -f tool/ci_kozhli_debug.dart

      - name: Run regression tests
        run: |
          rm -rf build/test_cache .dart_tool/test
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: panchapakshi_app/build/app/outputs/flutter-apk/app-release.apk
