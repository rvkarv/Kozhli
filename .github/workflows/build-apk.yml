name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panchapakshi_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable

      - name: Generate native Android project
        run: flutter create . --platforms=android --org com.panchapakshi.kozhi --project-name panchapakshi_kozhi

      - name: Verify regression sources after Flutter project generation
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MOON TEST SHA256=$(sha256sum test/master_workbook_moon_window_test.dart)"
          echo "KOZHLI TEST SHA256=$(sha256sum test/kozhli_success_windows_test.dart)"
          echo "MOON TEST FROM HEAD:"
          git show HEAD:./panchapakshi_app/test/master_workbook_moon_window_test.dart | sed -n '1,80p'
          echo "MOON TEST FROM WORKTREE:"
          sed -n '1,80p' test/master_workbook_moon_window_test.dart
          echo "KOZHLI TEST SHA256=$(sha256sum test/kozhli_success_windows_test.dart)"
          git status --short

      - name: Add KOZHLI launcher icon and app label
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_kozhli.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#171717" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
              <path android:fillColor="#E8A83A" android:pathData="M54,9A45,45 0,1 0,54 99A45,45 0,1 0,54 9M54,14A40,40 0,1 1,54 94A40,40 0,1 1,54 14"/>
              <path android:fillColor="#E09935" android:pathData="M49,51C35,43 26,50 25,62C24,76 38,84 53,80C65,77 72,67 70,55C68,44 58,38 49,39C43,30 48,20 57,20C66,20 71,28 68,37C75,37 82,41 87,47L96,52L87,57C82,58 77,57 72,54C74,66 68,78 56,84C50,87 43,87 38,84L34,94L29,94L33,82C23,76 20,65 24,55C28,45 38,41 49,51"/>
              <path android:fillColor="#4E9654" android:pathData="M42,45C31,35 20,39 18,49C29,47 37,53 42,60C37,48 29,42 22,40C31,33 41,36 48,43"/>
              <path android:fillColor="#D8323E" android:pathData="M57,20C53,14 57,8 62,12C65,6 72,10 70,17C77,14 80,21 74,25C68,28 61,26 57,20"/>
              <path android:fillColor="#F0B83F" android:pathData="M78,39L101,46L78,52Z"/>
              <path android:fillColor="#171717" android:pathData="M72,34A3.5,3.5 0,1 0,72 41A3.5,3.5 0,1 0,72 34"/>
              <path android:fillColor="#E8A83A" android:pathData="M46,80L42,99L48,99L53,82M61,80L64,99L70,99L66,78"/>
              <path android:fillColor="#E8A83A" android:pathData="M43,95L32,100L45,100M65,95L77,100L63,100"/>
          </vector>
          EOF
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/ic_kozhli"#' "$MANIFEST"
          sed -i 's#android:label="panchapakshi_kozhi"#android:label="KOZHLI PANCHAPAKSHI"#' "$MANIFEST"

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\n    <uses-permission android:name=\"android.permission.INTERNET\"/>#" $MANIFEST

      - name: Clean generated Flutter state
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Isolated KOZHLI calculation check
        run: |
          mkdir -p tool
          cat > tool/ci_kozhli_debug.dart <<'EOF'
          import 'package:panchapakshi_app/core/kozhli_success_rules.dart';
          import 'package:panchapakshi_app/models/pakshi.dart';
          void main() {
            final sunrise = DateTime(2026, 8, 14, 5, 46, 5, 443000);
            final sunset = DateTime(2026, 8, 14, 18, 29, 9, 913000);
            final day = KozhliSuccessRules.windowsForPeriod(
              periodStart: sunrise,
              periodEnd: sunset,
              paksham: Paksham.valarpirai,
              dayNight: DayNight.day,
              rulingWeekday: DateTime.friday,
              paduDay: false,
            );
            final night = KozhliSuccessRules.windowsForPeriod(
              periodStart: sunset,
              periodEnd: DateTime(2026, 8, 15, 5, 46, 18, 548000),
              paksham: Paksham.valarpirai,
              dayNight: DayNight.night,
              rulingWeekday: DateTime.friday,
              paduDay: false,
            );
            for (final w in day) print('DAY ${w.activity.tamil} ${w.start.toIso8601String()} -> ${w.end.toIso8601String()}');
            for (final w in night) print('NIGHT ${w.activity.tamil} ${w.start.toIso8601String()} -> ${w.end.toIso8601String()}');
          }
          EOF
          dart run tool/ci_kozhli_debug.dart
          rm -f tool/ci_kozhli_debug.dart

      - name: Run regression tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: panchapakshi_app/build/app/outputs/flutter-apk/app-release.apk
