name: Fix dashboard language list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add remaining Indian languages to dashboard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add remaining languages to dashboard selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('panchapakshi_app/lib/screens/home_screen.dart')
          s = p.read_text()
          marker = "                          _LanguageChoice('English', Locale('en')),"
          additions = """                          _LanguageChoice('Kashmiri / कश्मीरी', Locale('ks')),\n                          _LanguageChoice('Konkani / कोंकणी', Locale('kok')),\n                          _LanguageChoice('Meitei / মৈতৈলোন্', Locale('mni')),\n                          _LanguageChoice('Sanskrit / संस्कृतम्', Locale('sa')),\n                          _LanguageChoice('Nepali / नेपाली', Locale('ne')),\n                          _LanguageChoice('Maithili / मैथिली', Locale('mai')),\n                          _LanguageChoice('Dogri / डोगरी', Locale('doi')),\n                          _LanguageChoice('Bodo / बड़ो', Locale('brx')),\n                          _LanguageChoice('Santali / ᱥᱟᱱᱛᱟᱲᱤ', Locale('sat')),\n                          _LanguageChoice('Sindhi / सिन्धी', Locale('sd')),\n"""
          if additions.strip() not in s:
              if marker not in s:
                  raise SystemExit('English language marker not found')
              s = s.replace(marker, additions + marker, 1)
              p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panchapakshi_app/lib/screens/home_screen.dart
          git rm .github/workflows/fix-home-language-list.yml
          git commit -m 'Add remaining Indian languages to dashboard'
          git push
