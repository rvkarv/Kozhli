name: Complete Indian language list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Complete Indian scheduled-language selector') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add remaining scheduled languages to selectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          additions = """            ListTile(\n              leading: const Text('कॉशुर / کٲشُر', style: TextStyle(fontSize: 18)),\n              title: const Text('Kashmiri / कश्मीरी'),\n              onTap: () => Navigator.pop(context, const Locale('ks')),\n            ),\n            ListTile(\n              leading: const Text('कोंकणी', style: TextStyle(fontSize: 18)),\n              title: const Text('Konkani / कोंकणी'),\n              onTap: () => Navigator.pop(context, const Locale('kok')),\n            ),\n            ListTile(\n              leading: const Text('মৈতৈলোন্', style: TextStyle(fontSize: 18)),\n              title: const Text('Meitei / মৈতৈলোন্'),\n              onTap: () => Navigator.pop(context, const Locale('mni')),\n            ),\n            ListTile(\n              leading: const Text('संस्कृतम्', style: TextStyle(fontSize: 18)),\n              title: const Text('Sanskrit / संस्कृतम्'),\n              onTap: () => Navigator.pop(context, const Locale('sa')),\n            ),\n            ListTile(\n              leading: const Text('नेपाली', style: TextStyle(fontSize: 18)),\n              title: const Text('Nepali / नेपाली'),\n              onTap: () => Navigator.pop(context, const Locale('ne')),\n            ),\n            ListTile(\n              leading: const Text('मैथिली', style: TextStyle(fontSize: 18)),\n              title: const Text('Maithili / मैथिली'),\n              onTap: () => Navigator.pop(context, const Locale('mai')),\n            ),\n            ListTile(\n              leading: const Text('डोगरी', style: TextStyle(fontSize: 18)),\n              title: const Text('Dogri / डोगरी'),\n              onTap: () => Navigator.pop(context, const Locale('doi')),\n            ),\n            ListTile(\n              leading: const Text('बड़ो', style: TextStyle(fontSize: 18)),\n              title: const Text('Bodo / बड़ो'),\n              onTap: () => Navigator.pop(context, const Locale('brx')),\n            ),\n            ListTile(\n              leading: const Text('ᱥᱟᱱᱛᱟᱲᱤ', style: TextStyle(fontSize: 18)),\n              title: const Text('Santali / ᱥᱟᱱᱛᱟᱲᱤ'),\n              onTap: () => Navigator.pop(context, const Locale('sat')),\n            ),\n            ListTile(\n              leading: const Text('सिन्धी', style: TextStyle(fontSize: 18)),\n              title: const Text('Sindhi / सिन्धी'),\n              onTap: () => Navigator.pop(context, const Locale('sd')),\n            ),\n"""

          for filename in [
              'panchapakshi_app/lib/screens/forecast_screen.dart',
              'panchapakshi_app/lib/screens/home_screen.dart',
          ]:
              p = Path(filename)
              s = p.read_text()
              marker = """            ListTile(\n              leading: const Text('EN', style: TextStyle(fontSize: 18)),\n              title: const Text('English'),\n              onTap: () => Navigator.pop(context, const Locale('en')),\n            ),"""
              if marker not in s:
                  if filename.endswith('home_screen.dart'):
                      marker = """                          _LanguageChoice('English', Locale('en')),"""
                      if marker not in s:
                          raise SystemExit(f'English marker not found in {filename}')
                      home_add = additions.replace('ListTile(', '_LanguageChoice(').replace("leading: const Text('कॉशुर / کٲشُر', style: TextStyle(fontSize: 18)),\n              title: const Text('Kashmiri / कश्मीरी'),\n              onTap: () => Navigator.pop(context, const Locale('ks')),", "'Kashmiri / कश्मीरी', Locale('ks'))").replace("ListTile(", "_LanguageChoice(")
                      # Home helper uses two positional arguments, so build it directly.
                      home_add = """                          _LanguageChoice('Kashmiri / कश्मीरी', Locale('ks')),\n                          _LanguageChoice('Konkani / कोंकणी', Locale('kok')),\n                          _LanguageChoice('Meitei / মৈতৈলোন্', Locale('mni')),\n                          _LanguageChoice('Sanskrit / संस्कृतम्', Locale('sa')),\n                          _LanguageChoice('Nepali / नेपाली', Locale('ne')),\n                          _LanguageChoice('Maithili / मैथिली', Locale('mai')),\n                          _LanguageChoice('Dogri / डोगरी', Locale('doi')),\n                          _LanguageChoice('Bodo / बड़ो', Locale('brx')),\n                          _LanguageChoice('Santali / ᱥᱟᱱᱛᱟᱲᱤ', Locale('sat')),\n                          _LanguageChoice('Sindhi / सिन्धी', Locale('sd')),\n"""
                      s = s.replace(marker, home_add + marker)
                      p.write_text(s)
                      continue
                  raise SystemExit(f'English marker not found in {filename}')
              s = s.replace(marker, additions + marker, 1)
              p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panchapakshi_app/lib/screens/home_screen.dart panchapakshi_app/lib/screens/forecast_screen.dart
          git rm .github/workflows/complete-language-list.yml
          git commit -m 'Complete Indian scheduled-language selector'
          git push
