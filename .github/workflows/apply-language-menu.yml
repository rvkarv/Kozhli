name: Apply language menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Expand dashboard language menu') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand dashboard language selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('panchapakshi_app/lib/screens/home_screen.dart')
          s = p.read_text()
          old = """            ListTile(\n              leading: const Icon(Icons.translate, color: _gold),\n              title: const Text(\n                'மொழி / Language',\n                style: TextStyle(color: Colors.white),\n              ),\n              onTap: () {\n                Navigator.pop(context);\n                app.setLocale(\n                  app.locale.languageCode == 'ta'\n                      ? const Locale('en')\n                      : const Locale('ta'),\n                );\n              },\n            ),"""
          new = """            ListTile(\n              leading: const Icon(Icons.translate, color: _gold),\n              title: const Text(\n                'மொழி / Language',\n                style: TextStyle(color: Colors.white),\n              ),\n              onTap: () async {\n                Navigator.pop(context);\n                final selected = await showDialog<Locale>(\n                  context: context,\n                  builder: (context) => AlertDialog(\n                    title: const Text('Language / மொழி'),\n                    content: SingleChildScrollView(\n                      child: Column(\n                        mainAxisSize: MainAxisSize.min,\n                        children: const [\n                          _LanguageChoice('தமிழ்', Locale('ta')),\n                          _LanguageChoice('हिन्दी', Locale('hi')),\n                          _LanguageChoice('తెలుగు', Locale('te')),\n                          _LanguageChoice('ಕನ್ನಡ', Locale('kn')),\n                          _LanguageChoice('മലയാളം', Locale('ml')),\n                          _LanguageChoice('मराठी', Locale('mr')),\n                          _LanguageChoice('বাংলা', Locale('bn')),\n                          _LanguageChoice('ગુજરાતી', Locale('gu')),\n                          _LanguageChoice('ਪੰਜਾਬੀ', Locale('pa')),\n                          _LanguageChoice('অসমীয়া', Locale('as')),\n                          _LanguageChoice('ଓଡ଼ିଆ', Locale('or')),\n                          _LanguageChoice('اردو', Locale('ur')),\n                          _LanguageChoice('English', Locale('en')),\n                        ],\n                      ),\n                    ),\n                  ),\n                );\n                if (selected != null) app.setLocale(selected);\n              },\n            ),"""
          if old not in s:
              raise SystemExit('dashboard language menu block not found')
          s = s.replace(old, new)
          marker = "\nclass _HeaderStatus extends StatelessWidget {"
          helper = """\n\nclass _LanguageChoice extends StatelessWidget {\n  final String label;\n  final Locale locale;\n\n  const _LanguageChoice(this.label, this.locale);\n\n  @override\n  Widget build(BuildContext context) {\n    return ListTile(\n      title: Text(label),\n      onTap: () => Navigator.pop(context, locale),\n    );\n  }\n}\n"""
          if marker not in s:
              raise SystemExit('language helper insertion marker not found')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panchapakshi_app/lib/screens/home_screen.dart
          git rm .github/workflows/apply-language-menu.yml
          git commit -m 'Expand dashboard language menu'
          git push
