name: panchapakshi_app
description: >
  Panchapakshi Astrology app (கோழி, ஆந்தை, காகம், மயில், வல்லூறு).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Location
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.0

  # State + storage
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  path: ^1.9.0

  # Networking
  http: ^1.2.1

  # Licensing / device-binding
  firebase_core: ^3.1.0
  cloud_functions: ^5.0.0
  device_info_plus: ^10.1.0

  # Formatting
  intl: ^0.19.0

  # IANA timezone database / automatic DST
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
